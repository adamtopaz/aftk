name: Lean Action CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
      - name: Build core targets
        run: lake build AFTK Informalize aftk_file_worker aftk_server informalize
      - name: Run tests
        run: lake exe tests
