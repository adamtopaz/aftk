name = "aftk"
version = "0.1.0"
defaultTargets = ["aftk_server", "aftk_file_worker", "AFTK"]

[[require]]
name = "lean_worker"
git = "https://github.com/adamtopaz/lean_worker"
rev = "main"

[[lean_exe]]
name = "aftk_file_worker"
root = "AFTK.FileWorker"
supportInterpreter = true

[[lean_lib]]
name = "AFTK"

[[lean_exe]]
name = "aftk_server"
root = "AFTK.Server"
supportInterpreter = true
