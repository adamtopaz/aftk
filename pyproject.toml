[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aftk"
version = "0.1.0"
description = "Python client for aftk_server"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2,<3",
    "pydantic-ai>=1,<2",
]

[dependency-groups]
dev = [
    "pyright>=1.1.399",
    "ruff>=0.11",
]

[tool.setuptools.packages.find]
include = ["aftk*"]
