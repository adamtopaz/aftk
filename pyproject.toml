[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aftk"
version = "0.1.0"
description = "Python package for AFTK"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2,<3",
    "pydantic-ai>=1,<2",
    "hydra-core>=1.3,<2",
]

[project.scripts]
autoformalize = "aftk.cli:main"
aftk-inspect = "aftk.inspection_cli:main"

[tool.setuptools.packages.find]
include = ["aftk*", "aftk_client*"]

[tool.setuptools.package-data]
aftk = ["conf/*.yaml"]
