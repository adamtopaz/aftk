[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aftk-autoformalization"
version = "0.1.0"
description = "Async Python client for the AFTK Lean server"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2,<3",
]

[tool.setuptools.packages.find]
include = ["aftk_client*"]
