[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aftk"
version = "0.1.0"
description = "Python package for AFTK"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2,<3",
]

[tool.setuptools.packages.find]
include = ["aftk*", "aftk_client*"]
