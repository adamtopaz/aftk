project_root: .
entrypoint_path: entrypoint.md
sources_dir: sources
state_dir: .aftk
max_iterations: 100
pricing_overrides_path: null
output: json
models:
  initializer: null
  orchestrator: null
  worker: null
logging:
  level: info
  console: true
  file: true
  file_path: .aftk/cli.log
  file_format: text
  dependency_level: warning
  include_http: false
  include_llm_payloads: false
  include_tool_payloads: summary
  include_command_output: summary
  live_traces: true
  trace_model_events: summary
  trace_tool_events: true
  trace_thinking_deltas: false
  structured_events: true
  structured_event_path: .aftk/events.jsonl

hydra:
  run:
    dir: .
  output_subdir: null
  job:
    chdir: false
